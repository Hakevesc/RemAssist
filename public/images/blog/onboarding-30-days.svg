<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- calendar -->
    <rect x="160" y="66" width="160" height="140" rx="14" fill="#ffffff" fill-opacity=".08" stroke-opacity=".9" stroke-width="1.6"/>
    <path d="M160 100h160" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M196 54v24M284 54v24" stroke-opacity=".85" stroke-width="1.6"/>

    <!-- grid of days -->
    <g stroke-opacity=".45" stroke-width="1.3">
      <path d="M186 122h108M186 144h108M186 166h108M186 188h108"/>
      <path d="M212 108v82M238 108v82M264 108v82M290 108v82"/>
    </g>

    <!-- highlighted progress cells (week one/two/three) -->
    <rect x="186" y="108" width="26" height="14" rx="3" fill="#ffffff" fill-opacity=".5" stroke="none"/>
    <rect x="212" y="108" width="26" height="14" rx="3" fill="#ffffff" fill-opacity=".5" stroke="none"/>
    <rect x="186" y="130" width="26" height="14" rx="3" fill="#ffffff" fill-opacity=".32" stroke="none"/>
    <rect x="212" y="130" width="26" height="14" rx="3" fill="#ffffff" fill-opacity=".32" stroke="none"/>
    <rect x="238" y="130" width="26" height="14" rx="3" fill="#ffffff" fill-opacity=".32" stroke="none"/>

    <!-- milestone flag -->
    <g transform="translate(340,140)" stroke-opacity=".9" stroke-width="1.6">
      <path d="M0 -30v70"/>
      <path d="M0 -30l30 10-30 10z" fill="#ffffff" fill-opacity=".22"/>
    </g>

    <!-- check mark on final week -->
    <g transform="translate(270,177)" stroke-opacity=".95" stroke-width="1.8">
      <path d="M-9 0l6 6 12-14"/>
    </g>

    <circle cx="90" cy="70" r="2.2" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="70" cy="220" r="2" fill="#ffffff" fill-opacity=".35" stroke="none"/>
    <circle cx="420" cy="60" r="2.4" fill="#ffffff" fill-opacity=".4" stroke="none"/>
  </g>
</svg>
