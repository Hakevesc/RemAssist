<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rem Assistance — Logo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:transparent}
  canvas{position:fixed;inset:0;display:block}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

/* Rem Assistance Logo — exact SVG paths & exact colors */
const SVG_LOGO = `<svg version="1.0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 311.2 382">
<path fill="#37BCF0" d="M173.5,13c7.6,0,15.2,0.6,22.7,2.1s9.7,3,9.4,8.3c-0.7,11.1-17.9,4.8-24.5,4.5C92.4,23.7,19.9,92.7,25.6,182.5 c0.5,8.8,4.8,20.8,5,28.1c0.1,4.5-3.7,8.5-8.3,8.1C12.2,217.9,9,176.9,10.6,157c5.6-64.1,55.2-121.9,117-138.5l15-3.1 c8-1.6,16.1-2.4,24.2-2.4H173.5L173.5,13z"/>
<path fill="#0E8FD8" d="M236.8,178.8c-2.4-2.1-2.5-6-3.3-9.3c-1-5.1-1.9-11.2-3-15.7c-1.9-7.6-5.9-15-10.6-21.1 c-27.7-36.1-88.8-29.6-107.4,12c-26.3,58.8,33.1,108.4,87.1,116.6c5.8,1.3,10.4-2.8,16-3.7c6.1-0.9,10.5-0.1,16.3,0.2 c12.5,0.2,18.1,13.1,10.9,22.8c-3.7,4.5-10.2,5.1-15.6,5.4c-14.1,0.7-15.8,0.2-26.2-7.3s-12.7-2.7-18.7-4.2 c-53-12.9-106.3-62.7-90.7-121.3c21.1-87.8,150.3-76.8,159.1,11.9c0.4,4.2,0.5,7.8-1.6,11C246.7,180.1,240.5,181.8,236.8,178.8 L236.8,178.8z"/>
<path fill="#05AEEE" d="M155.4,37.3c24.2-2,47.4,1.1,69.6,10.8c7,3.1,24,9.6,19.4,19.1c-5.5,11.3-19.1-0.4-26.8-3.7 C121,22,22.6,115.5,58.9,214.2c2.1,5.6,10.5,19.6,10.8,23.3c0.5,7.1-5.1,11.5-11.8,8.7c-7.5-3.1-18-33.7-20-42 C19.5,125.9,74.3,44.2,155.4,37.3z"/>
<path fill="#0B9CE0" d="M280.6,183c0.3-168-232.1-148.7-218.9-1.6c1.6,18.3,7.7,36,17.5,51.6c13.2,21,27.5,40.1,13.6,69.6 c-3.1,6.6-16.3,19.3-3.9,24.6c6.9,3,11.7-4.5,14.9-9.5c10.3-17,12.2-38.1,7.5-57.6c-2.5-10.4-7.2-20.1-13.2-28.9 c-28.8-42-26.6-78.7,2.1-119.5c44.6-53.5,133.9-36.6,156.7,28.5c6.9,19.7,3.8,37.2,11.2,56.8c2.2,5.8,15.6,30.7,14.4,34.4 c-0.8,2.3-12.2,2.9-15.6,4.4c-16.9,7.4-5.4,41.2-15.3,54.7c-5.9,8-18,4.7-26.5,5.5c-26.6,2.7-46.2,34.5-52.5,58 c-1.9,4.7-2.8,13.6,4,15.3c12.6,1.6,12.4-15.8,16.8-24c27-51.4,39.3-20.9,66.7-39.3c16.5-12.3,11.9-45.8,14.6-54.9 c29.3-3,27.8-18.4,20.8-35.3C291.4,206,280.7,183.2,280.6,183L280.6,183z"/>
</svg>`;

/* Helpers */
const clamp01 = v => Math.max(0, Math.min(1, v));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIOC = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOutQuint = x => 1 - Math.pow(1 - x, 5);
const easeOutBack = x => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
};

/* Exact brand colors */
const COLORS = [0x37BCF0, 0x0E8FD8, 0x05AEEE, 0x0B9CE0];

/* Timeline */
const TRACE_START   = 0.30;
const TRACE_STAGGER = 0.12;
const TRACE_DUR     = 1.40;
const FILL_OFFSET   = 0.55;   // fill begins this many seconds after its trace starts
const FILL_DUR      = 1.10;
const DISSOLVE_START_OFFSET = 1.15; // stroke begins dissolving this long after its trace starts
const DISSOLVE_DUR  = 0.55;
const LOCK_START    = 3.40;
const LOCK_DUR      = 0.90;

/* Renderer — transparent */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOV = 40;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 10, 4000);
let camZ = 560;
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const tanF = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  camZ = (382 * 1.45) / (2 * tanF);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
fitCamera();
camera.position.set(0, 0, camZ);
camera.lookAt(0, 0, 0);

/* SVG parse */
const CX = 311.2 / 2, CY = 382 / 2;
const toLogo = p => new THREE.Vector2(p.x - CX, CY - p.y);
const data = new SVGLoader().parse(SVG_LOGO);
const ensureCCW = p => { if (THREE.ShapeUtils.isClockWise(p)) p.reverse(); return p; };

/* --- Stroke shader: comet-tail line reveal --- */
const strokeVert = `
  attribute float lineDistance;
  uniform float uMaxDist;
  uniform float uProgress;
  uniform float uTail;
  varying float vAlpha;
  void main() {
    float head = uProgress * uMaxDist;
    float distBehind = head - lineDistance;
    vAlpha = 0.0;
    if (distBehind > 0.0) {
      vAlpha = 1.0 - smoothstep(0.0, uTail, distBehind);
    }
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const strokeFrag = `
  uniform vec3 uColor;
  uniform float uOpacity;
  varying float vAlpha;
  void main() {
    gl_FragColor = vec4(uColor, vAlpha * uOpacity);
    #include <colorspace_fragment>
  }
`;

/* --- Fill shader: guaranteed radial wipe from shape center --- */
const fillVert = `
  varying vec2 vPos;
  void main() {
    vPos = position.xy;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const fillFrag = `
  uniform float uProgress;
  uniform float uOpacity;
  uniform vec3 uColor;
  uniform vec2 uCenter;
  uniform float uRadius;
  varying vec2 vPos;
  void main() {
    float d = distance(vPos, uCenter) / uRadius;
    float edge = uProgress * 1.05;
    float reveal = smoothstep(edge, edge - 0.18, d);
    if (reveal <= 0.001) discard;
    /* soft rim highlight at the leading edge */
    float rim = smoothstep(edge - 0.22, edge - 0.06, d) * (1.0 - smoothstep(edge - 0.06, edge + 0.02, d));
    vec3 col = uColor + rim * 0.18;
    gl_FragColor = vec4(col, reveal * uOpacity);
    #include <colorspace_fragment>
  }
`;

/* Build each of the 4 ribbon paths */
const logoGroup = new THREE.Group();
scene.add(logoGroup);

const pieces = data.paths.map((path, i) => {
  const shapes = SVGLoader.createShapes(path);
  const shape = shapes[0];
  const pts = shape.getPoints(140);
  const localPts = ensureCCW(pts.map(q => new THREE.Vector2(q.x - CX, -(q.y - CY))));

  /* Bounding box for radial fill */
  const box = new THREE.Box2().setFromPoints(localPts);
  const center = box.getCenter(new THREE.Vector2());
  const size = box.getSize(new THREE.Vector2());
  const radius = size.length() / 2 * 1.02;

  /* Stroke geometry with lineDistance for comet-tail */
  const lineGeo = new THREE.BufferGeometry().setFromPoints(localPts);
  const distances = new Float32Array(localPts.length);
  let totalDist = 0;
  for (let j = 0; j < localPts.length; j++) {
    if (j > 0) totalDist += localPts[j].distanceTo(localPts[j - 1]);
    distances[j] = totalDist;
  }
  lineGeo.setAttribute('lineDistance', new THREE.BufferAttribute(distances, 1));

  const strokeMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: {
      uColor: { value: new THREE.Color(COLORS[i]) },
      uOpacity: { value: 1.0 },
      uMaxDist: { value: totalDist },
      uProgress: { value: 0.0 },
      uTail: { value: totalDist * 0.18 }
    },
    vertexShader: strokeVert,
    fragmentShader: strokeFrag
  });
  const lineMesh = new THREE.LineLoop(lineGeo, strokeMat);
  lineMesh.renderOrder = 2;

  /* Fill mesh with guaranteed radial wipe */
  const fillGeo = new THREE.ShapeGeometry(new THREE.Shape(localPts));
  const fillMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: {
      uColor: { value: new THREE.Color(COLORS[i]) },
      uOpacity: { value: 1.0 },
      uProgress: { value: 0.0 },
      uCenter: { value: center.clone() },
      uRadius: { value: radius }
    },
    vertexShader: fillVert,
    fragmentShader: fillFrag
  });
  const fillMesh = new THREE.Mesh(fillGeo, fillMat);
  fillMesh.renderOrder = 1;

  const group = new THREE.Group();
  group.add(fillMesh, lineMesh);
  logoGroup.add(group);

  return { group, strokeMat, fillMat };
});

/* Central droplet that kicks off the sequence */
const dropGeo = new THREE.CircleGeometry(8, 32);
const dropMat = new THREE.MeshBasicMaterial({ color: 0x37BCF0, transparent: true, opacity: 0 });
const dropMesh = new THREE.Mesh(dropGeo, dropMat);
dropMesh.position.z = 10;
logoGroup.add(dropMesh);

/* Animation */
const start = performance.now() + 200;
function update(t, tAbs) {
  /* 1. Central droplet — appears and fades as strokes begin */
  const dropP = ramp(t, 0.0, 0.5);
  if (dropP > 0 && dropP < 1) {
    dropMesh.visible = true;
    dropMesh.scale.setScalar(0.4 + easeOutQuint(dropP) * 2.2);
    dropMat.opacity = (1.0 - dropP) * 0.95;
  } else {
    dropMesh.visible = false;
  }

  /* 2. Per-piece trace / fill / dissolve */
  pieces.forEach((p, i) => {
    const tStart = TRACE_START + i * TRACE_STAGGER;

    /* Stroke trace (comet tail) */
    const traceP = easeOutQuint(ramp(t, tStart, tStart + TRACE_DUR));
    p.strokeMat.uniforms.uProgress.value = traceP;

    /* Fill — radial wipe from shape center, starts slightly after trace begins */
    const fStart = tStart + FILL_OFFSET;
    const fillP = easeIOC(ramp(t, fStart, fStart + FILL_DUR));
    p.fillMat.uniforms.uProgress.value = fillP;

    /* Stroke dissolve — fades out once fill is well underway */
    const dStart = tStart + DISSOLVE_START_OFFSET;
    const dissolveP = easeIOC(ramp(t, dStart, dStart + DISSOLVE_DUR));
    p.strokeMat.uniforms.uOpacity.value = 1.0 - dissolveP;
  });

  /* 3. Elastic lock/settle after everything has filled */
  const lockP = ramp(t, LOCK_START, LOCK_START + LOCK_DUR);
  let lockScale = 1.0;
  let lockRot = 0.0;
  if (lockP > 0 && lockP < 1) {
    if (lockP < 0.35) {
      const sub = lockP / 0.35;
      lockScale = 1.0 - 0.05 * easeIOC(sub);
      lockRot = 0.04 * easeIOC(sub);
    } else {
      const sub = (lockP - 0.35) / 0.65;
      lockScale = 0.95 + 0.05 * easeOutBack(sub);
      lockRot = 0.04 * (1.0 - easeOutBack(sub));
    }
  }

  /* 4. Idle breathing (keeps the final logo alive) */
  const idleP = ramp(t, LOCK_START + LOCK_DUR, LOCK_START + LOCK_DUR + 1.0);
  const breathe = 1.0 + 0.012 * Math.sin(tAbs * 1.4) * idleP;
  const microRot = Math.sin(tAbs * 0.35) * 0.006 * idleP;

  logoGroup.scale.setScalar(lockScale * breathe);
  logoGroup.rotation.z = lockRot + microRot;
}

function frame(now) {
  requestAnimationFrame(frame);
  update((now - start) / 1000, now / 1000);
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
  camera.position.z = camZ;
});
requestAnimationFrame(frame);
</script>
</body>
</html>
