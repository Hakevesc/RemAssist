<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Rem Assist support agent">
  <!-- Rem Assist — agent portrait 1. Original flat-vector artwork, sized to
       drop straight into the 64px agent circles. Square viewBox with the
       subject centred, so it reads correctly under a circular crop. -->
  <defs>
    <clipPath id="a1clip"><circle cx="100" cy="100" r="100"></circle></clipPath>
    <linearGradient id="a1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"></stop>
      <stop offset="1" stop-color="#CFE3FB"></stop>
    </linearGradient>
  </defs>
  <g clip-path="url(#a1clip)">
    <rect width="200" height="200" fill="url(#a1bg)"></rect>

    <!-- shoulders -->
    <path d="M28 200v-14c0-26 21-47 47-47h50c26 0 47 21 47 47v14z" fill="#518DE0"></path>
    <path d="M86 139l14 26 14-26" fill="none" stroke="#EAF3FF" stroke-width="6" stroke-linejoin="round"></path>

    <!-- neck -->
    <path d="M86 112h28v26a14 14 0 0 1-28 0z" fill="#DCE7F8"></path>

    <!-- head -->
    <circle cx="100" cy="86" r="38" fill="#F2F7FE"></circle>

    <!-- hair: filled crown cap + side lengths -->
    <path d="M58 90A42 42 0 0 1 142 90Z" fill="#0E2A67"></path>
    <path d="M58 90h13v36a6.5 6.5 0 0 1-13 0z" fill="#0E2A67"></path>
    <path d="M129 90h13v36a6.5 6.5 0 0 1-13 0z" fill="#0E2A67"></path>

    <!-- headset -->
    <path d="M60 90a40 40 0 0 1 80 0" fill="none" stroke="#F4F8FF" stroke-width="8" stroke-linecap="round"></path>
    <path d="M62 90a38 38 0 0 1 76 0" fill="none" stroke="#0E2A67" stroke-width="4" stroke-linecap="round"></path>
    <rect x="49" y="76" width="19" height="31" rx="9" fill="#34BDF0"></rect>
    <rect x="132" y="76" width="19" height="31" rx="9" fill="#34BDF0"></rect>

    <!-- mic boom -->
    <path d="M60 107c0 15 8 26 20 29" fill="none" stroke="#0E2A67" stroke-width="5" stroke-linecap="round"></path>
    <rect x="76" y="130" width="18" height="10" rx="5" fill="#0E2A67"></rect>
  </g>
</svg>
