<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 95 325 215" width="325" height="215" role="img" aria-label="Two Rem Assist support agents wearing headsets">
  <!-- Rem Assist — agent duo, cropped to the upper body.
       The artwork is still drawn on its original 470x430 grid; the viewBox
       simply frames heads-to-mid-torso so the figures read at portrait scale
       instead of shrinking to fit a full standing pose.
       Motion is deliberately slight: a slow breathing float on each figure and
       a headset "on air" ping. Animation lives inside the file because the
       page loads this through <img>, where external CSS does not apply. -->
  <defs>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.50" stop-color="#fff" stop-opacity="1"></stop>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0.55"></stop>
      <stop offset="0.74" stop-color="#fff" stop-opacity="0"></stop>
    </linearGradient>
    <mask id="fade">
      <rect x="0" y="0" width="470" height="430" fill="url(#fadeGrad)"></rect>
    </mask>

    <linearGradient id="uniFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"></stop>
      <stop offset="1" stop-color="#DDE8FA"></stop>
    </linearGradient>
    <linearGradient id="uniBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6CFF6"></stop>
      <stop offset="1" stop-color="#8FB6EE"></stop>
    </linearGradient>
  </defs>

  <style>
    /* two different periods so the pair never bobs in lockstep */
    @keyframes remFloatFront { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4.5px); } }
    @keyframes remFloatBack  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes remPing       { 0% { transform: scale(0.55); opacity: 0.5; } 70%, 100% { transform: scale(1.7); opacity: 0; } }
    .rem-front { animation: remFloatFront 6.5s ease-in-out infinite; }
    .rem-back  { animation: remFloatBack 8s ease-in-out infinite 0.7s; }
    .rem-ping  { transform-box: fill-box; transform-origin: 50% 50%; animation: remPing 3.4s ease-out infinite; }
    .rem-ping-b { animation-delay: 1.7s; }
    @media (prefers-reduced-motion: reduce) {
      .rem-front, .rem-back, .rem-ping { animation: none; }
      .rem-ping { opacity: 0; }
    }
  </style>

  <g mask="url(#fade)">

    <!-- ============ BACK AGENT (Pro) ============ -->
    <g class="rem-back" opacity="0.85">
      <path d="M104 430V312c0-31 25-56 56-56s56 25 56 56v118z" fill="url(#uniBack)"></path>
      <path d="M144 261l16 30 16-30" fill="none" stroke="#6E9EE4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M104 430v-98c-13 8-21 23-21 40v58z" fill="#9CC0F1"></path>
      <path d="M216 430v-98c13 8 21 23 21 40v58z" fill="#9CC0F1"></path>
      <path d="M148 220h24v24a12 12 0 0 1-24 0z" fill="#A8C6F2"></path>
      <circle cx="160" cy="186" r="33" fill="#C6DAF8"></circle>
      <path d="M124 189A36 36 0 0 1 196 189Z" fill="#7FA9E8"></path>
      <rect x="124" y="180" width="10" height="22" rx="5" fill="#7FA9E8"></rect>
      <rect x="186" y="180" width="10" height="22" rx="5" fill="#7FA9E8"></rect>
      <path d="M129 188a31 31 0 0 1 62 0" fill="none" stroke="#5C8FDE" stroke-width="7" stroke-linecap="round"></path>
      <circle class="rem-ping rem-ping-b" cx="128" cy="190" r="15" fill="none" stroke="#BFE0FF" stroke-width="3"></circle>
      <rect x="120" y="177" width="16" height="26" rx="8" fill="#5C8FDE"></rect>
      <rect x="184" y="177" width="16" height="26" rx="8" fill="#5C8FDE"></rect>
      <path d="M130 203c0 12 6 20 16 22" fill="none" stroke="#5C8FDE" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="148" cy="226" r="5" fill="#5C8FDE"></circle>
    </g>

    <!-- ============ FRONT AGENT (Expert) ============ -->
    <g class="rem-front">
      <path d="M222 430V290c0-38 30-68 68-68s68 30 68 68v140z" fill="url(#uniFront)"></path>
      <path d="M270 229l20 36 20-36" fill="none" stroke="#C3D5F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M290 265v34" fill="none" stroke="#518DE0" stroke-width="5" stroke-linecap="round"></path>
      <rect x="277" y="299" width="26" height="34" rx="5" fill="#518DE0"></rect>
      <rect x="283" y="307" width="14" height="4" rx="2" fill="#BFE0FF"></rect>
      <rect x="283" y="315" width="14" height="4" rx="2" fill="#BFE0FF"></rect>
      <path d="M222 430v-120c-16 10-26 28-26 48v72z" fill="#E7EFFB"></path>
      <path d="M358 430v-120c16 10 26 28 26 48v72z" fill="#E7EFFB"></path>
      <path d="M274 186h32v30a16 16 0 0 1-32 0z" fill="#DCE7F8"></path>
      <circle cx="290" cy="150" r="39" fill="#F2F7FE"></circle>
      <path d="M247 154A43 43 0 0 1 333 154Z" fill="#0E2A67"></path>
      <path d="M247 154h12v34a6 6 0 0 1-12 0z" fill="#0E2A67"></path>
      <path d="M321 154h12v34a6 6 0 0 1-12 0z" fill="#0E2A67"></path>
      <path d="M252 152a38 38 0 0 1 76 0" fill="none" stroke="#F4F8FF" stroke-width="8" stroke-linecap="round"></path>
      <path d="M254 152a36 36 0 0 1 72 0" fill="none" stroke="#0E2A67" stroke-width="4" stroke-linecap="round"></path>
      <circle class="rem-ping" cx="249" cy="154" r="18" fill="none" stroke="#34BDF0" stroke-width="3.5"></circle>
      <rect x="240" y="139" width="19" height="31" rx="9" fill="#34BDF0"></rect>
      <rect x="321" y="139" width="19" height="31" rx="9" fill="#34BDF0"></rect>
      <path d="M251 170c0 15 7 25 19 28" fill="none" stroke="#0E2A67" stroke-width="5" stroke-linecap="round"></path>
      <rect x="266" y="192" width="18" height="10" rx="5" fill="#0E2A67"></rect>
    </g>

  </g>
</svg>
